<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>Sudoku</h1>
      <div class="stats">
        <span id="timer" aria-label="Waktu">00:00</span>
        <span class="dot">·</span>
        <span id="mistakes">Salah: 0/3</span>
      </div>
    </header>

    <nav class="levels" role="tablist" aria-label="Pilih tingkat kesulitan">
      <button class="level active" data-level="easy" role="tab">Easy</button>
      <button class="level" data-level="medium" role="tab">Medium</button>
      <button class="level" data-level="hard" role="tab">Hard</button>
    </nav>

    <section class="board-wrap">
      <div id="board" class="board" aria-label="Papan Sudoku"></div>
      <div id="overlay" class="overlay hidden">
        <div class="overlay-card">
          <h2 id="overlay-title">Selamat!</h2>
          <p id="overlay-text"></p>
          <button id="overlay-btn" class="primary">Main lagi</button>
        </div>
      </div>
    </section>

    <section class="controls">
      <div class="actions">
        <button id="undo" class="action" title="Undo">↶<span>Undo</span></button>
        <button id="erase" class="action" title="Hapus">⌫<span>Hapus</span></button>
        <button id="notes" class="action" title="Catatan">✎<span>Catatan <b id="notes-state">Off</b></span></button>
        <button id="hint" class="action" title="Petunjuk">💡<span>Petunjuk <b id="hint-count">3</b></span></button>
      </div>
      <div id="numpad" class="numpad"></div>
      <button id="new-game" class="primary wide">Game baru</button>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
